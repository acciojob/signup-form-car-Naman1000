<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<form method="post" class="order">
	<label for="name" >Name</label>
		<input type="text" required="Yes" id="name" placeholder="Name">

		<label for="email">Email</label>
		<input type="email" required="Yes" id="email" placeholder="email">

		<label for="gender_m,gender_f">Gender</label>
		<input type="radio" required="Yes" id="gender_m,gender_f" placeholder="">
		
		<label for="cars">Car Brands</label>
		<input type="select" required="Yes" id="cars" placeholder="Please choose an option">

		<label for="age">Age</label>
		<input type="Number" required="Yes" id="age" placeholder="Age">

		<label for="dob">DOB</label>
		<input type="Date" required="Yes" id="dob" placeholder="">

		<label for="tel">Phone Number</label>
		<input type="tel" required="No" id="tel" placeholder="xxx-xxx-xxx">
		

		<label for="password">Password</label>
		<input type="Password" required="Yes" id="password" placeholder="Password">

		<label for="tos">I agree to the TOS</label>
		<input type="Checkbox" required="Yes" id="tos" placeholder="">

		<button type="submit">Submit</button>


		
	</form>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
